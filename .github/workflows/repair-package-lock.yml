name: Repair package-lock

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repair-package-lock.yml'

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Regenerate package-lock and apply Next.js security update
        run: |
          npm pkg set dependencies.next=16.3.4
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Validate clean install
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit repaired dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Repair npm lockfile and update Next.js to 16.3.4"
          git push origin HEAD:main
